# AQI Tracking System - full local stack.
#   docker compose up -d --build
# See README.md for architecture, ports and operations.
name: aqi

x-s3-env: &s3-env
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-aqiadmin}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aqiadmin-secret}

x-flink: &flink
  build:
    context: .
    dockerfile: flink/Dockerfile
  image: aqi/flink:1.18.1
  restart: unless-stopped
  environment: &flink-env
    KAFKA_BOOTSTRAP: kafka:9092
    ALERT_COOLDOWN_MINUTES: ${ALERT_COOLDOWN_MINUTES:-15}
    ANOMALY_Z_THRESHOLD: ${ANOMALY_Z_THRESHOLD:-4.0}
    DETECTION_PARALLELISM: ${DETECTION_PARALLELISM:-2}
    LANDING_PARALLELISM: ${LANDING_PARALLELISM:-2}
    FLINK_PROPERTIES: |
      jobmanager.rpc.address: jobmanager
      jobmanager.memory.process.size: 1024m
      taskmanager.memory.process.size: ${FLINK_TM_MEMORY:-2560m}
      taskmanager.memory.managed.fraction: 0.3
      taskmanager.numberOfTaskSlots: ${FLINK_TM_SLOTS:-4}
      parallelism.default: 2
      state.backend.type: hashmap
      state.checkpoints.dir: s3://flink/checkpoints
      state.savepoints.dir: s3://flink/savepoints
      execution.checkpointing.externalized-checkpoint-retention: RETAIN_ON_CANCELLATION
      restart-strategy.type: exponential-delay
      restart-strategy.exponential-delay.initial-backoff: 5 s
      restart-strategy.exponential-delay.max-backoff: 2 min
      s3.endpoint: http://minio:9000
      s3.path.style.access: true
      s3.access-key: ${MINIO_ROOT_USER:-aqiadmin}
      s3.secret-key: ${MINIO_ROOT_PASSWORD:-aqiadmin-secret}
      metrics.reporter.prom.factory.class: org.apache.flink.metrics.prometheus.PrometheusReporterFactory
      metrics.reporter.prom.port: 9249
      python.executable: python3
      python.client.executable: python3

x-airflow: &airflow
  build: ./airflow
  image: aqi/airflow:2.10.3
  restart: unless-stopped
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-}
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-aqi}:${POSTGRES_PASSWORD:-aqi}@postgres:5432/airflow
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY:-change-me-in-production}
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW_CONN_TRINO_DEFAULT: trino://airflow@trino:8080/?catalog=hive
    PYTHONPATH: /opt/airflow/pylibs
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./aqi_common:/opt/airflow/pylibs/aqi_common:ro
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

services:
  # ------------------------------------------------------------------ metadata DB
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aqi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aqi}
      POSTGRES_DB: aqi
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d aqi"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ------------------------------------------------------------------ ingestion
  kafka:
    image: apache/kafka:3.8.0
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms512m -Xmx1g
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  kafka-init:
    image: apache/kafka:3.8.0
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_REPLICATION_FACTOR: 1
      AQI_RAW_PARTITIONS: ${AQI_RAW_PARTITIONS:-12}
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"

  sensor-simulator:
    build: ./generator
    image: aqi/sensor-simulator:latest
    restart: unless-stopped
    command:
      - --bootstrap=kafka:9092
      - --sensors=${SIM_SENSORS:-40}
      - --interval=${SIM_INTERVAL_SECONDS:-5}
      - --anomaly-rate=${SIM_ANOMALY_RATE:-0.002}
      - --episode-rate=${SIM_EPISODE_RATE:-0.5}
      - --malformed-rate=${SIM_MALFORMED_RATE:-0.0005}
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # ------------------------------------------------------------------ storage
  minio:
    # MinIO removed its images from Docker Hub/quay.io; bitnamilegacy is the frozen Bitnami build.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aqiadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aqiadmin-secret}
      MINIO_API_PORT_NUMBER: 9000
      MINIO_CONSOLE_PORT_NUMBER: 9001
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    # Same image: it bundles the `mc` client.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    entrypoint: ["/bin/sh", "/init-buckets.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aqiadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aqiadmin-secret}
      LANDING_RETENTION_DAYS: ${LANDING_RETENTION_DAYS:-90}
    volumes:
      - ./minio/init-buckets.sh:/init-buckets.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------------ stream processing
  jobmanager:
    <<: *flink
    command: jobmanager
    ports:
      - "8081:8081"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 30

  taskmanager:
    <<: *flink
    command: taskmanager
    depends_on:
      jobmanager:
        condition: service_healthy

  flink-job-submitter:
    <<: *flink
    entrypoint: ["/opt/flink/bin/submit-jobs.sh"]
    command: []
    restart: on-failure
    depends_on:
      jobmanager:
        condition: service_healthy
      taskmanager:
        condition: service_started
      kafka-init:
        condition: service_completed_successfully

  # ------------------------------------------------------------------ catalog + query engine
  hive-metastore:
    build: ./hive
    image: aqi/hive-metastore:4.0.0
    restart: unless-stopped
    environment:
      <<: *s3-env
      SERVICE_NAME: metastore
      DB_DRIVER: postgres
      HIVE_CUSTOM_CONF_DIR: /hive_custom_conf
      SERVICE_OPTS: >-
        -Xmx1g
        -Djavax.jdo.option.ConnectionDriverName=org.postgresql.Driver
        -Djavax.jdo.option.ConnectionURL=jdbc:postgresql://postgres:5432/metastore
        -Djavax.jdo.option.ConnectionUserName=${POSTGRES_USER:-aqi}
        -Djavax.jdo.option.ConnectionPassword=${POSTGRES_PASSWORD:-aqi}
    volumes:
      - ./hive/conf:/hive_custom_conf:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083'"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  trino:
    image: trinodb/trino:455
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      <<: *s3-env
    volumes:
      - ./trino/catalog:/etc/trino/catalog:ro
    mem_limit: ${TRINO_MEMORY_LIMIT:-3g}
    depends_on:
      hive-metastore:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/lib/trino/bin/health-check"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  trino-init:
    image: trinodb/trino:455
    entrypoint: ["trino", "--server", "http://trino:8080", "--user", "admin", "--file", "/sql/ddl.sql"]
    volumes:
      - ./trino/sql:/sql:ro
    depends_on:
      trino:
        condition: service_healthy
    restart: on-failure

  # ------------------------------------------------------------------ orchestration
  airflow-init:
    <<: *airflow
    command: version
    restart: "no"
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER:-admin}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "8088:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      trino-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ------------------------------------------------------------------ monitoring & alerting
  aqi-exporter:
    build: ./exporter
    image: aqi/exporter:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.8.0
    restart: unless-stopped
    command: ["--kafka.server=kafka:9092", "--topic.filter=aqi.*", "--group.filter=aqi-.*"]
    ports:
      - "9308:9308"
    depends_on:
      kafka:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v2.54.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    command: ["--web.external-url=http://localhost:9093"]
    ports:
      - "9093:9093"
    environment:
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:-mailpit:1025}
      SMTP_FROM: ${SMTP_FROM:-aqi-alerts@example.org}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-false}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-oncall@example.org}
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-http://alert-sink:8080/slack}
      SLACK_CHANNEL_AQI: ${SLACK_CHANNEL_AQI:-#aqi-alerts}
      SLACK_CHANNEL_PLATFORM: ${SLACK_CHANNEL_PLATFORM:-#data-platform-oncall}
      SMS_WEBHOOK_URL: ${SMS_WEBHOOK_URL:-http://alert-sink:8080/sms}
    volumes:
      - ./monitoring/alertmanager/alertmanager.tmpl.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
      - ./monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - ./monitoring/alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager-data:/alertmanager

  # Local stand-in for Slack / SMS gateways: logs every webhook payload (docker compose logs alert-sink).
  alert-sink:
    image: mendhak/http-https-echo:34
    restart: unless-stopped
    environment:
      HTTP_PORT: 8080
      LOG_IGNORE_PATH: /health

  # Local SMTP server + web inbox for alert emails (http://localhost:8025).
  mailpit:
    image: axllent/mailpit:v1.20
    restart: unless-stopped
    ports:
      - "8025:8025"

  grafana:
    image: grafana/grafana:11.2.2
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: trino-datasource
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/aqi-overview.json
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
      - trino

volumes:
  postgres-data:
  kafka-data:
  minio-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  airflow-logs:
