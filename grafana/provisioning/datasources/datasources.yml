apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      alertmanagerUid: alertmanager

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

  # Curated / aggregated AQI datasets in the lakehouse (Hive catalog via Trino).
  - name: Trino
    uid: trino
    type: trino-datasource
    access: proxy
    url: http://trino:8080
    jsonData:
      clientTags: grafana
