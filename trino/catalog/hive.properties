connector.name=hive
hive.metastore.uri=thrift://hive-metastore:9083

# Native S3 filesystem against MinIO (handles s3:// and s3a:// locations)
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}

hive.storage-format=PARQUET
hive.compression-codec=ZSTD
# Allow writes to external tables and make INSERTs into existing partitions idempotent (overwrite).
hive.non-managed-table-writes-enabled=true
hive.insert-existing-partitions-behavior=OVERWRITE
hive.recursive-directories=false
hive.max-partitions-per-writers=500
# Needed for `CALL system.sync_partition_metadata` and partition registration from Airflow.
hive.allow-register-partition-procedure=true
