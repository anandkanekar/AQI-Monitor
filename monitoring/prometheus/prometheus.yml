global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    platform: aqi

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]

  # Kafka broker/topic/consumer-group metrics (lag per group/partition).
  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]

  # Flink PrometheusReporter on JobManager and TaskManagers (job status, checkpoints, throughput).
  - job_name: flink
    static_configs:
      - targets: ["jobmanager:9249"]
        labels: { component: jobmanager }
    dns_sd_configs:
      - names: ["taskmanager"]
        type: A
        port: 9249
    relabel_configs:
      - source_labels: [__meta_dns_name]
        regex: taskmanager
        target_label: component
        replacement: taskmanager

  # AQI business metrics bridged from Kafka.
  - job_name: aqi-exporter
    static_configs:
      - targets: ["aqi-exporter:8000"]

  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ["minio:9000"]

  - job_name: grafana
    static_configs:
      - targets: ["grafana:3000"]
